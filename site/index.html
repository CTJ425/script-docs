<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Script Docs</title>
    <meta
      name="description"
      content="可以直接執行的維運手冊：AI CLI 用量狀態列 (agy / Claude Code)、RHEL/Rocky VM 範本封裝、Kubernetes 叢集部署、Supabase Self-Hosted 自動化部署、Ollama 本地 LLM 容器與 Proxmox VE ISO 工具。每支腳本一行 curl 即可執行，內容由各專案 README.md 逐位元組渲染。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo is a width x weight grid, which is the thing Univers actually is.
      EB Garamond is Sabon's own lineage. Noto Serif TC / Noto Sans TC carry the
      same two jobs in Chinese, where a manual sets its body in 明體 and its
      headings in 黑體. Chivo Mono shares Archivo's foundry and skeleton.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Chivo+Mono:wght@400..700&family=EB+Garamond:wght@400..600&family=Noto+Sans+TC:wght@700..900&family=Noto+Serif+TC:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Settle the theme before the first paint. The stylesheet reads
      // data-theme; main.tsx keeps it true from here on.
      (function () {
        var m = null;
        try {
          m = localStorage.getItem('scd-color-mode');
        } catch (e) {}
        if (m !== 'light' && m !== 'dark') {
          m =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = m;
        document.documentElement.style.colorScheme = m;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
