<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Script &amp; Container Docs</title>
    <meta
      name="description"
      content="自動化腳本與系統配置統一手冊：RHEL/Rocky VM 一鍵封裝、Kubernetes 叢集部署、Ollama 本地 LLM 容器與 Proxmox VE ISO 工具。內容直接由各專案 README.md 渲染。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored palette mode before first paint to avoid a flash.
      (function () {
        try {
          var m = localStorage.getItem('scd-color-mode');
          if (m === 'light' || m === 'dark') {
            document.documentElement.style.colorScheme = m;
            document.documentElement.dataset.initialMode = m;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
