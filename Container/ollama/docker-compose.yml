# Ollama + Open WebUI
#
# GPU (default):
#   docker compose up -d
# CPU only:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Open WebUI: http://localhost:8080
# Ollama API: http://127.0.0.1:11434 (loopback only, see the note below)

services:
  ollama:
    container_name: ollama
    restart: unless-stopped
    image: ollama/ollama:0.32.2
    ports:
      # Bound to loopback on purpose: the Ollama API has no authentication, and
      # publishing it on 0.0.0.0 hands model execution to anyone who can reach
      # this host. Open WebUI talks to it over the compose network, not this
      # port, so the mapping only exists for local CLI use. Change it to
      # "11434:11434" only on a trusted, firewalled network.
      - 127.0.0.1:11434:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    container_name: openwebui
    restart: unless-stopped
    image: ghcr.io/open-webui/open-webui:v0.10.2
    depends_on:
      # Without this the WebUI starts first and its initial model list is
      # empty until a manual refresh.
      ollama:
        condition: service_started
    ports:
      - 8080:8080
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama-data:
  openwebui-data:
