name: Deploy site to GitHub Pages

# The site is generated from the repo's own files — posts, tools, pages and each
# script's README — so any push that touches one of them republishes it. There is
# no separate content step.
#
# GitHub Pages is the current host; the site is moving to Cloudflare Pages, which
# builds from the repo itself (see site/README.md). When that is live, delete this
# workflow.
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'tools/**'
      - 'pages/**'
      - '**/README.md'
      - '**/docs.json'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never interrupt a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # Astro 7 needs Node >= 22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Contrast and content rules
        run: npm run test

      # Origin and base path come from the environment: on Actions they default to
      # https://<owner>.github.io and /<repo>, derived from GITHUB_REPOSITORY, so
      # renaming the repo needs no edit here. The build also writes the search index.
      - name: Build
        run: npm run build

      - name: Verify the built site
        run: npm run test:dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
