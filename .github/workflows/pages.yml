name: Deploy docs portal to GitHub Pages

# The site is generated from the repo's README.md files, so any push that
# touches a README republishes the portal — there is no separate content step.
on:
  push:
    branches: [main]
    paths:
      - '**/README.md'
      - '**/docs.json'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never interrupt a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test (render every README, check anchors, code blocks, links)
        run: npm run test

      # sync-content.mjs runs inside the Vite build, so the manifest is always
      # regenerated from the READMEs at this commit. The Pages base path is
      # derived from GITHUB_REPOSITORY, so renaming the repo needs no edit here.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
