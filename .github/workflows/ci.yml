name: CI

# Guards the things that actually break these scripts: shell bugs, invalid
# compose files, and the one-liner curl URLs going stale after a repo rename.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; }
          done < <(find . -name '*.sh' -not -path './site/node_modules/*' -print0)
          exit $fail

      - name: ShellCheck
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            shellcheck -s bash "$f" || fail=1
          done < <(find . -name '*.sh' -not -path './site/node_modules/*' -print0)
          exit $fail

      - name: Scripts must be executable and expose --help
        run: |
          fail=0
          for f in script/RHEL-Family-Temp/seal-rhel-template.sh \
                   container/k8s_env_init/k8s_env_initialization.sh \
                   container/k8s_install/k8s_cluster_install.sh \
                   script/pve_link_iso/pve_link_iso.sh \
                   script/deploy-supabase/deploy-supabase.sh \
                   AI/skill/install.sh; do
            [ -x "$f" ] || { echo "::error file=$f::not executable (chmod +x)"; fail=1; }
            bash "$f" --help >/dev/null 2>&1 || { echo "::error file=$f::--help failed"; fail=1; }
          done
          exit $fail

  skills:
    name: Claude Code skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The installer downloads exactly what manifest.json lists, so a file
      # added to a skill folder and not listed there is a file nobody who
      # installs ever receives. A name mismatch is just as silent: Claude Code
      # keys a skill by its frontmatter `name`, the installer by its folder.
      - name: manifest must match the skill folders
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path('AI/skill')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          listed = {s['name']: set(s['files']) for s in manifest['skills']}
          fail = []

          on_disk = {d.name for d in root.iterdir() if d.is_dir()}
          for extra in sorted(on_disk - listed.keys()):
              fail.append(f'{extra}/ is not in manifest.json')
          for missing in sorted(listed.keys() - on_disk):
              fail.append(f'manifest.json lists {missing}/ but there is no such folder')

          for name in sorted(listed.keys() & on_disk):
              d = root / name
              actual = {f.name for f in d.iterdir() if f.is_file()} - {'README.md'}
              for extra in sorted(actual - listed[name]):
                  fail.append(f'{name}/{extra} exists but manifest.json does not list it')
              for missing in sorted(listed[name] - actual):
                  fail.append(f'manifest.json lists {name}/{missing} but the file is missing')

              skill = d / 'SKILL.md'
              if skill.is_file():
                  m = re.search(r'^name:\s*(\S+)\s*$', skill.read_text(encoding='utf-8'), re.M)
                  if not m:
                      fail.append(f'{name}/SKILL.md has no `name:` in its frontmatter')
                  elif m.group(1) != name:
                      fail.append(f'{name}/SKILL.md says name: {m.group(1)} — it must equal the folder name')

          for line in fail:
              print(f'::error::{line}')
          sys.exit(1 if fail else 0)
          PY

      # A skill file is expanded for shell positional parameters before it is
      # run, so a literal $1 in one is replaced by the skill's argument text.
      - name: skills must not contain shell positional parameters
        run: |
          if grep -rnE '\$[0-9]' AI/skill/*/SKILL.md; then
            echo "::error::the lines above use \$N, which the skill loader replaces before the shell sees it"
            exit 1
          fi

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GPU config
        working-directory: container/ollama
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Validate CPU override and confirm it drops the GPU reservation
        working-directory: container/ollama
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config >/dev/null
          if docker compose -f docker-compose.yml -f docker-compose.cpu.yml config | grep -q 'nvidia'; then
            echo "::error::the CPU override still requests an NVIDIA device"
            exit 1
          fi

      - name: Ollama API must stay on loopback
        working-directory: container/ollama
        run: |
          if ! docker compose -f docker-compose.yml config | grep -q 'host_ip: 127.0.0.1'; then
            echo "::error::port 11434 is not bound to 127.0.0.1 — the Ollama API has no authentication"
            exit 1
          fi

  links:
    name: README one-liners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A repo rename silently breaks every documented curl command, and the
      # failure only shows up for whoever copy-pastes it. Check them here.
      - name: raw.githubusercontent URLs must point at this repo and resolve
        run: |
          fail=0
          urls=$(grep -rhoE 'https://raw\.githubusercontent\.com/[^ )"'"'"'}{]+' \
                   --include='*.md' --include='*.sh' . \
                 | grep -F "${GITHUB_REPOSITORY}" | sort -u)
          if [ -z "$urls" ]; then
            echo "::error::no raw URLs found for ${GITHUB_REPOSITORY} — did the repo move?"
            exit 1
          fi
          for u in $urls; do
            # Installers hold a *base* URL and append the filename at runtime
            # (so a fork can point AGY_HUD_RAW_BASE / USAGE_HUB_RAW_BASE
            # elsewhere). raw.githubusercontent has no directory listing, so a
            # base always 404s on its own — probe the README that lives in it,
            # which still proves the path exists at this commit.
            case "$u" in
              *.sh|*.py|*.js|*.mjs|*.md|*.yml|*.yaml|*.json) target="$u" ;;
              *) target="$u/README.md" ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' "$target")
            if [ "$code" = "200" ]; then
              echo "ok   $target"
            else
              echo "::error::HTTP $code for $target"
              fail=1
            fi
          done
          # Any raw URL naming a *different* CTJ425 repo is a leftover after the move.
          if grep -rhoE 'https://raw\.githubusercontent\.com/CTJ425/[^/]+' \
               --include='*.md' --include='*.sh' . \
             | sort -u | grep -v "CTJ425/${GITHUB_REPOSITORY#*/}$"; then
            echo "::error::the URLs above reference a different repository"
            fail=1
          fi
          exit $fail

  site:
    name: Site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
